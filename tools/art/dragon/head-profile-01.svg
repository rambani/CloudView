<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 210">
  <!-- Dragon head in profile, facing LEFT. Dense fine-line: brow ridge,
       almond eye with slit pupil, nostril, open jaw with two rows of teeth,
       cheek and jaw scale rows, two swept-back horns, jaw frill. -->

  <!-- skull: snout tip up over the brow to the back of the head -->
