  <path id="brow" d="M 120 72 C 136 60 158 58 176 66 C 184 70 190 76 192 82"/>
  <path id="brow-fold" d="M 128 78 C 142 70 158 68 172 74"/>
  <!-- eye: almond, slit pupil, glint -->
  <path id="eye" d="M 138 86 C 148 76 166 76 178 86 C 166 96 148 96 138 86 Z"/>
  <path id="pupil" d="M 158 79 C 161 84 161 89 158 94 C 155 89 155 84 158 79 Z"/>
  <circle id="glint" cx="152" cy="83" r="1.6"/>
  <path id="eye-crease" d="M 134 92 C 146 100 166 100 182 92"/>
  <!-- snout top detail + nostril -->
  <path id="snout-ridge" d="M 40 80 C 54 72 72 68 90 66"/>
  <path id="nostril" d="M 44 90 C 40 86 42 80 48 80 C 52 80 52 86 48 88"/>
