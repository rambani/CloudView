<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120">
  <!-- Whale's face on the left end: small kind eye with a fold above,
       long upturned mouth line with baleen marks, throat grooves, a
       pectoral fin below. Faces LEFT. -->
  <path id="eye" d="M 150 44 C 156 36 168 36 174 44 C 168 52 156 52 150 44 Z"/>
  <circle id="pupil" cx="163" cy="44" r="3.5"/>
  <path id="eye-fold" d="M 146 36 C 156 28 170 28 180 36"/>
  <path id="cheek" d="M 176 56 C 184 60 190 66 192 74"/>
  <!-- mouth: long curve up toward the eye -->
  <path id="mouth" d="M 4 78 C 50 86 110 84 160 70 C 170 66 178 62 184 56"/>
  <path id="lip" d="M 4 78 C 20 72 40 70 60 72"/>
  <!-- baleen marks along the upper jaw -->
  <path id="baleen" d="M 40 76 L 40 84 M 56 77 L 56 86 M 72 78 L 72 87 M 88 78 L 88 87 M 104 77 L 104 86 M 120 75 L 120 83 M 136 72 L 136 80"/>
  <!-- throat grooves -->
  <path id="groove" d="M 30 90 C 60 100 100 104 140 98"/>
  <path id="groove" d="M 40 100 C 70 110 110 112 146 106"/>
  <path id="groove" d="M 56 110 C 84 118 116 118 148 112"/>
  <!-- pectoral fin -->
  <path id="fin" d="M 120 96 C 134 108 152 116 176 118 C 168 108 160 100 150 92"/>
  <path id="fin-line" d="M 128 100 C 142 108 156 112 170 116"/>
  <!-- spots -->
  <circle id="spot" cx="196" cy="40" r="2.5"/>
  <circle id="spot" cx="204" cy="54" r="2"/>
  <circle id="spot" cx="190" cy="24" r="2"/>
</svg>
